# Pipeline de QA (bonus: paralelización, monitoreo de ejecución y métricas en CI)
name: QA Asisya

on:
  push:
  pull_request:
  schedule:
    - cron: '0 */6 * * *' # regresión programada cada 6 horas (aproximación a monitoreo 24/7)

jobs:
  frontend:
    name: Frontend Playwright (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # paralelización entre máquinas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: 'true'
          ASISYA_USER: ${{ secrets.ASISYA_USER || 'usuario_test' }}
          ASISYA_PASS: ${{ secrets.ASISYA_PASS || 'clave123' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            reports/
            test-results/

  api:
    name: API Postman + Newman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:api:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: newman-report, path: reports/newman/ }
      - name: Publicar resultados JUnit
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Newman
          path: reports/junit/newman-results.xml
          reporter: java-junit

  carga:
    name: SLA seguimiento (JMeter 10 rps x 30 s)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: |
          curl -sSL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar xz
          echo "JMETER_HOME=$PWD/apache-jmeter-5.6.3" >> $GITHUB_ENV
      - run: npm run test:load:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jmeter-dashboard, path: reports/jmeter/ }
